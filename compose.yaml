  # Each app is its own choice. The default is the compose as it stands: all
  # thirteen. Leaving one out drops its service; nothing else changes.
  choices:
    photocraft:
      label: PhotoCraft
      doc: Image editing with layers, masks, adjustment layers and PSD files (Photoshop).
      default: "on"
      options:
        "on": { label: "Included" }
        "off": { label: "Left out", drop: [photocraft] }
    vectorcraft:
      label: VectorCraft
      doc: Vector illustration (Illustrator).
      default: "on"
      options:
        "on": { label: "Included" }
        "off": { label: "Left out", drop: [vectorcraft] }
    filmcraft:
      label: FilmCraft
      doc: Video editing (Premiere Pro).
      default: "on"
      options:
        "on": { label: "Included" }
        "off": { label: "Left out", drop: [filmcraft] }
    lightcraft:
      label: LightCraft
      doc: Photo library and raw developer (Lightroom).
      default: "on"
      options:
        "on": { label: "Included" }
        "off": { label: "Left out", drop: [lightcraft] }
    pdfcraft:
      label: PdfCraft
      doc: Read, organize, combine, split and secure PDFs (Acrobat).
      default: "on"
      options:
        "on": { label: "Included" }
        "off": { label: "Left out", drop: [pdfcraft] }
    effectcraft:
      label: EffectCraft
      doc: Motion graphics and visual effects (After Effects).
      default: "on"
      options:
        "on": { label: "Included" }
        "off": { label: "Left out", drop: [effectcraft] }
    designcraft:
      label: DesignCraft
      doc: Page layout and publishing (InDesign).
      default: "on"
      options:
        "on": { label: "Included" }
        "off": { label: "Left out", drop: [designcraft] }
    wordcraft:
      label: WordCraft
      doc: Document editor (Word).
      default: "on"
      options:
        "on": { label: "Included" }
        "off": { label: "Left out", drop: [wordcraft] }
    gridcraft:
      label: GridCraft
      doc: Spreadsheet (Excel).
      default: "on"
      options:
        "on": { label: "Included" }
        "off": { label: "Left out", drop: [gridcraft] }
    deckcraft:
      label: DeckCraft
      doc: Presentation editor (PowerPoint).
      default: "on"
      options:
        "on": { label: "Included" }
        "off": { label: "Left out", drop: [deckcraft] }
    figcraft:
      label: FigCraft
      doc: Interface design and prototyping (Figma).
      default: "on"
      options:
        "on": { label: "Included" }
        "off": { label: "Left out", drop: [figcraft] }
    soundcraft:
      label: SoundCraft
      doc: Audio recording, editing and mixing (Pro Tools).
      default: "on"
      options:
        "on": { label: "Included" }
        "off": { label: "Left out", drop: [soundcraft] }
    cadcraft:
      label: CADCraft
      doc: Computer-aided design and drafting (AutoCAD).
      default: "on"
      options:
        "on": { label: "Included" }
        "off": { label: "Left out", drop: [cadcraft] }

  docs:
    services:
      photocraft: "Image editor (Photoshop)"
      vectorcraft: "Vector illustration (Illustrator)"
      filmcraft: "Video editor (Premiere Pro)"
      lightcraft: "Photo library and raw developer (Lightroom)"
      pdfcraft: "PDF workbench (Acrobat)"
      effectcraft: "Motion graphics and effects (After Effects)"
      designcraft: "Page layout (InDesign)"
      wordcraft: "Document editor (Word)"
      gridcraft: "Spreadsheet (Excel)"
      deckcraft: "Presentation editor (PowerPoint)"
      figcraft: "Interface design (Figma)"
      soundcraft: "Audio recording and mixing (Pro Tools)"
      cadcraft: "CAD and drafting (AutoCAD)"
    env:
      PUID: "User ID for the nginx worker processes"
      PGID: "Group ID for the nginx worker processes"
      TZ: "Timezone for the containers"
    ports:
      8080: PhotoCraft
      8081: VectorCraft
      8082: FilmCraft
      8083: LightCraft
      8084: PdfCraft
      8085: EffectCraft
      8086: DesignCraft
      8087: WordCraft
      8088: GridCraft
      8089: DeckCraft
      8090: FigCraft
      8091: SoundCraft
      8092: CADCraft

  readme:
    setup: |-
      **Everything runs in the browser.** Each app is Rust compiled to WebAssembly; the containers only serve static files. Files open through the browser's file picker and save as downloads, and nothing is stored server side, so there are no volumes.

      **Your work lives in the browser, not on the server.** Preferences, LightCraft's photo library (in the browser's origin-private file system) and EffectCraft's offline cache belong to the browser profile that opened the app, per origin. Clearing site data, switching browsers, or reaching the app under a different hostname means starting empty. Export what you want to keep; the exported files are the backup, as with any desktop app.

      **HTTPS.** WebGPU and the clipboard need a secure context. Over plain HTTP the apps fall back to WebGL2; put them behind your reverse proxy for the full experience.

      **Fonts.** The browser builds ship with only two fonts. PhotoCraft, WordCraft, GridCraft, DeckCraft and CADCraft also list the Japanese, Chinese and Arabic families from [craft-fonts](https://github.com/storytold/craft-fonts), which their images serve alongside the app; a family is downloaded the first time you pick it or open a document that uses it.

services:
  photocraft:
    container_name: photocraft
    image: ghcr.io/daemonless/photocraft:latest
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    ports:
      - "8080:80"
    restart: always

