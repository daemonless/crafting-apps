#
# Crafting Apps for FreeBSD (Daemonless)
#
# ArtCraft's thirteen open-source creative and office apps, each a static WebAssembly site
# served by nginx. Pick the ones you want; nothing is shared between them.
#
# Usage:
#   1. Copy example.env to .env and edit
#   2. Run: podman-compose up -d
#

name: crafting-apps

x-daemonless:
  title: Crafting Apps
  icon: ':material-palette:'
  category: Photos & Media
  description: ArtCraft's thirteen open-source, clean-room creative and office apps (PhotoCraft, VectorCraft, FilmCraft, LightCraft, PdfCraft, EffectCraft, DesignCraft, WordCraft, GridCraft, DeckCraft, FigCraft, SoundCraft, CADCraft) as WebAssembly web apps. Pick the ones you want.
  upstream_url: https://github.com/storytold
  web_url: https://getartcraft.com/apps
  type: stack
  community: "Discord:https://discord.gg/Kb9tkhecZT"

  # Every app is something people open in a browser, so all of them go where
  # the stack is put. Nothing talks to anything else.
  networking:
    "*": default

  appjail:
    director:
      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        photocraft:
          name: photocraft
          options:
            - container: 'boot args:--pull=newer'
            - expose: '8080:80 proto:tcp'
            - from: ghcr.io/daemonless/photocraft:latest
          oci:
            user: root
            environment:
              - PUID: "!ENV '${PUID}'"
              - PGID: "!ENV '${PGID}'"
              - TZ: "!ENV '${TZ}'"
        vectorcraft:
          name: vectorcraft
          options:
            - container: 'boot args:--pull=newer'
            - expose: '8081:80 proto:tcp'
            - from: ghcr.io/daemonless/vectorcraft:latest
          oci:
            user: root
            environment:
              - PUID: "!ENV '${PUID}'"
              - PGID: "!ENV '${PGID}'"
              - TZ: "!ENV '${TZ}'"
        filmcraft:
          name: filmcraft
          options:
            - container: 'boot args:--pull=newer'
            - expose: '8082:80 proto:tcp'
            - from: ghcr.io/daemonless/filmcraft:latest
          oci:
            user: root
            environment:
              - PUID: "!ENV '${PUID}'"
              - PGID: "!ENV '${PGID}'"
              - TZ: "!ENV '${TZ}'"
        lightcraft:
          name: lightcraft
          options:
            - container: 'boot args:--pull=newer'
            - expose: '8083:80 proto:tcp'
            - from: ghcr.io/daemonless/lightcraft:latest
          oci:
            user: root
            environment:
              - PUID: "!ENV '${PUID}'"
              - PGID: "!ENV '${PGID}'"
              - TZ: "!ENV '${TZ}'"
        pdfcraft:
